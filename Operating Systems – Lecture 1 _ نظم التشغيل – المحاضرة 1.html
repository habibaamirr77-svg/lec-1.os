<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operating Systems – Lecture 1 | نظم التشغيل – المحاضرة 1</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#5c667a;--acc:#2f6fe4;--acc2:#e8f0fe;--bd:#dcd8cc;--ok:#1a9e6f;--bad:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#182030;--ink:#e8ecf4;--mut:#9aa6bd;--acc:#6ea8ff;--acc2:#1e2c47;--bd:#2a3550}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:14px}
#bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.stage{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0}
h1{font-size:1.45rem;margin:0}.en{color:var(--mut);direction:ltr;text-align:left}
svg{width:100%;height:auto;display:block;margin:8px 0;direction:ltr}
svg text{font-family:inherit}
.sh{opacity:0;scale:.7;transform-box:fill-box;transform-origin:center;transition:opacity .5s,scale .5s}.sh.on{opacity:1;scale:1}
.gr{opacity:0;scale:0 1;transform-box:fill-box;transform-origin:left;transition:opacity .3s,scale .9s}.gr.on{opacity:1;scale:1 1}
.sub{background:var(--acc2);border-radius:14px;padding:10px 14px;min-height:92px}.sub .ar{font-size:1.2rem;font-weight:600}.sub .en{font-size:1rem;margin-top:2px}
.ctl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
button.main{background:var(--acc);color:#fff;border-color:var(--acc);min-width:110px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 2px}.chips button{padding:4px 12px;font-size:.85rem;flex:none}.chips button.a{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.note{color:var(--mut);font-size:.85rem;text-align:center}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--acc2);color:var(--acc);font-size:.85rem;font-weight:600}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:10px 14px}.opt .e{direction:ltr;text-align:left;color:var(--mut);font-size:.9rem}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--acc2)}
</style>
</head>
<body>
<div class="wrap">
<div id="bar"><i></i></div>
<div class="stage" id="stage"></div>
<div class="ctl" id="ctl"><button id="prev">⏮</button><button class="main" id="play">▶ ابدأ · Start</button><button id="next">⏭</button>
<select id="lang"><option value="ar">🔊 عربي</option><option value="en">🔊 English</option></select>
<select id="rate"><option value="0.8">بطيء · Slow</option><option value="0.95" selected>عادي · Normal</option><option value="1.15">سريع · Fast</option></select></div>

</div>

{t:["إيه هو المورد؟","What is a resource?"],s:[

["وأجهزة الإدخال والإخراج زي الكيبورد والماوس والشاشة والطابعة.","And I/O devices such as the keyboard, mouse, monitor, and printer."],
["مثال: المطبخ. الشيف هو المعالج، والترابيزة هي الرام، والتلاجة هي التخزين.","Example: a kitchen. The chef is the CPU, the counter is RAM, the fridge is storage."]],
v:()=>[["⚙️","CPU","Runs code",C.b,1],["🧠","RAM","Holds programs",C.p,1],["💾","Storage","HDD / SSD",C.o,2],["⌨️","I/O","Mouse, printer",C.t,3],["📄","Files","Data on disk",C.g,2]].map((d,i)=>G(d[5],10+i*116,10,card(106,125,d[3],d[0],d[1],d[2]))).join("")+G(4,30,165,R(540,100,"#6b5a3a")+T(270,40,"👨‍🍳 Chef = CPU    🍽️ Counter = RAM    🧊 Fridge = Storage",16)+T(270,75,"Kitchen analogy · تشبيه المطبخ",14,"#f3e7c9"))},
{t:["هيكل نظام الكمبيوتر","Computer system structure"],s:[

["الأولى العتاد Hardware: المعالج والذاكرة وأجهزة الإدخال والإخراج.","First, the hardware: CPU, memory, and I/O devices."],
["فوقه نظام التشغيل، وهو الوسيط اللي بيتحكم في استخدام العتاد.","On top is the OS, which coordinates the use of the hardware."],

["وفي الآخر المستخدم: شخص أو جهاز أو كمبيوتر تاني.","Finally the users: people, machines, or other computers."]],
v:()=>[["Hardware","⚙️ CPU · Memory · I/O devices",C.o,1,205],["Operating System","🛠️ Manages & coordinates hardware",C.b,2,140],["Application Programs","📝 Word · 🌐 Browser · 🧪 Compiler · 🎮 Games",C.g,3,75],["Users","🧑 People · 🤖 Machines · 💻 Other computers",C.p,4,10]].map(d=>G(d[3],60,d[4],R(480,56,d[2])+T(240,24,d[0],18)+T(240,45,d[1],13))).join("")+G(1,0,0,"")},
{t:["إيه هو نظام التشغيل؟","What is an Operating System?"],s:[
["نظام التشغيل برنامج وسيط بين المستخدم والعتاد.","The OS is a program that sits between the user and the hardware."],
["هو موزّع للموارد: لو برامج كتير عايزة المعالج، بيختار بعدل.","It is a resource allocator: when many programs want the CPU, it decides fairly."],
["وهو برنامج تحكم: بيمنع أي برنامج غلط من إنه يبوّظ الجهاز.","It is also a control program: it stops a faulty program from harming the system."],
["زي ظابط المرور في التقاطع، بينظّم ويمنع الفوضى.","Like a traffic officer at an intersection, it organizes and prevents chaos."]],
v:()=>{const A=[["🌐 Browser",C.b],["🎮 Game",C.g],["📝 Word",C.o],["🐞 Faulty",C.r]];return A.map((a,i)=>G(0,10,10+i*65,R(120,50,a[1])+T(60,32,a[0],15))).join("")+G(0,230,10,R(140,245,C.p)+T(70,110,"🚦",50)+T(70,160,"Operating",17)+T(70,182,"System",17))+G(1,450,85,R(130,90,C.t)+T(65,45,"⚙️",30)+T(65,75,"CPU",17))+G(1,0,0,[0,1,2].map(i=>`<circle r="6" style="fill:${[C.b,C.g,C.o][i]}"><animateMotion dur="${2+i*.4}s" repeatCount="indefinite" path="M130 ${35+i*65} L230 120 L450 130"/></circle>`).join(""))+G(2,150,235,T(0,15,"🚫",36)+`<text x="40" y="30" font-size="15" style="fill:${C.r}">Blocked by OS</text>`)}},
{t:["الخلاصة","Recap"],s:[
["المورد هو أي حاجة بيديرها نظام التشغيل.","A resource is anything the OS manages."],
["النظام = عتاد + نظام تشغيل + برامج + مستخدمين.","System = hardware + OS + applications + users."],
["نظام التشغيل بيوزّع الموارد بعدل.","The OS allocates resources fairly."],
["وبيتحكم في تنفيذ البرامج ويمنع الأخطاء.","And it controls program execution to prevent errors."]],
v:()=>["Resource = anything the OS manages","System = Hardware + OS + Apps + Users","OS = Resource allocator","OS = Control program"].map((x,i)=>G(i,60,15+i*60,R(480,46,[C.b,C.g,C.o,C.p][i])+T(240,30,"✅ "+x,17))).join("")}
];
const Q=[
{d:0,q:["إيه من دول مورد (Resource) بيديره نظام التشغيل؟","Which of these is a resource managed by the OS?"],o:[["متصفح الويب","A web browser"],["المعالج CPU","The CPU"],["لعبة فيديو","A video game"],["برنامج Word","A word processor"]],c:1,x:["المعالج والرام والتخزين والإدخال/الإخراج والملفات كلها موارد. الباقي برامج تطبيقية.","CPU, RAM, storage, I/O and files are resources. The others are application programs."]},
{d:0,q:["نظام التشغيل بيشتغل كوسيط بين…","The OS acts as an intermediary between…"],o:[["المستخدم والعتاد","The user and the hardware"],["الطابعة والشاشة","The printer and the monitor"],["Word والمتصفح","Word and the browser"],["الرام والهارد","RAM and the hard disk"]],c:0,x:["ده التعريف الأساسي لنظام التشغيل.","That is the core definition of an OS."]},
{d:0,q:["أي مثال يعتبر برنامج تطبيقي (Application)؟","Which is an application program?"],o:[["الرام RAM","RAM"],["متصفح الويب","A web browser"],["المعالج CPU","CPU"],["الكيبورد","The keyboard"]],c:1,x:["المتصفح برنامج مصمم لمهمة معينة للمستخدم.","A browser is software designed for a specific user task."]},
{d:1,q:["إيه مكونات نظام الكمبيوتر الأربعة؟","What are the four components of a computer system?"],o:[["CPU, RAM, Disk, Printer","CPU, RAM, Disk, Printer"],["Windows, Linux, macOS, Android","Windows, Linux, macOS, Android"],["عتاد، نظام تشغيل، تطبيقات، مستخدمين","Hardware, OS, applications, users"],["Hardware, Software, Network, Cloud","Hardware, Software, Network, Cloud"]],c:2,x:["الأربعة: Hardware و OS و Applications و Users.","The four: hardware, operating system, application programs and users."]},
{d:1,q:["ما هو الـ Resource؟","What is a resource?"],o:[["أي ملف على الهارد فقط","Any file on the disk only"],["أي برنامج بيشتغل","Any running program"],["أي جهاز إدخال فقط","Any input device only"],["أي كيان مادي أو منطقي بيديره نظام التشغيل ويخصصه للعمليات","Any physical or logical entity the OS manages and allocates to processes"]],c:3,x:["ده التعريف الكامل من المحاضرة.","This is the full definition from the lecture."]},
{d:1,q:["لما نقول إن نظام التشغيل Control Program، يبقى…","Calling the OS a control program means it…"],o:[["بيتحكم في تنفيذ البرامج ويمنع الأخطاء والاستخدام الغلط","Controls program execution to prevent errors and improper use"],["بيرسم الواجهة بس","Only draws the interface"],["بيزوّد حجم الرام","Increases the RAM size"],["بيخزّن الملفات","Stores the files"]],c:0,x:["الدور ده يحمي الجهاز من الأخطاء.","This role protects the system from errors."]},
{d:2,q:["رتّب الطبقات من الأسفل للأعلى.","Order the layers from bottom to top."],o:[["Users → Apps → OS → Hardware","Users → Apps → OS → Hardware"],["Hardware → OS → Apps → Users","Hardware → OS → Apps → Users"],["Hardware → Apps → OS → Users","Hardware → Apps → OS → Users"],["OS → Hardware → Users → Apps","OS → Hardware → Users → Apps"]],c:1,x:["العتاد في الأساس، فوقه نظام التشغيل، ثم التطبيقات، ثم المستخدم.","Hardware at the base, then the OS, then applications, then users."]},
{d:2,q:["برنامجين طلبوا المعالج في نفس الوقت، ونظام التشغيل اداهم دور بالعدل. أي دور ده؟","Two programs request the CPU at the same time and the OS gives each a fair turn. Which role is this?"],o:[["Application program","Application program"],["Hardware","Hardware"],["Resource allocator","Resource allocator"],["Control program","Control program"]],c:2,x:["الفصل بين الطلبات المتعارضة بعدل هو دور موزّع الموارد.","Deciding between conflicting requests fairly is the resource allocator role."]}
];
const $=id=>document.getElementById(id),QN=S.length;let i=0,j=0,playing=false,tok=0,timer=0,V={ar:null,en:null},qi=0,score=0,done=false;
function vo(){try{const v=speechSynthesis.getVoices();V.ar=v.find(x=>/^ar-EG/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null;V.en=v.find(x=>/^en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
vo();try{speechSynthesis.onvoiceschanged=vo}catch(e){}
$("chips").innerHTML=S.map((x,n)=>`<button data-n="${n}">${n+1}</button>`).join("")+`<button data-n="${QN}">❓ Quiz</button>`;
function mark(){document.querySelectorAll("#stage [data-s]").forEach(g=>g.classList.toggle("on",+g.dataset.s<=j))}
function chips(){[...$("chips").children].forEach((b,n)=>b.classList.toggle("a",n==i));$("bar").firstChild.style.width=(i>=QN?100:(i+j/S[i].s.length)/QN*100)+"%"}
function btn(){$("play").textContent=playing?"⏸":"▶";$("ctl").style.display=i>=QN?"none":"flex"}
function scene(){const x=S[i];$("stage").innerHTML=`<h1>${x.t[0]}</h1><div class="en">${x.t[1]}</div><svg viewBox="0 0 600 280">${x.v()}</svg><div class="sub"><div class="ar" id="sa"></div><div class="en" id="se"></div></div>`;void $("stage").offsetWidth;sub();mark();chips();btn()}
function sub(){const s=S[i].s[Math.min(j,S[i].s.length-1)];$("sa").textContent=s[0];$("se").textContent=s[1]}
function stop(){tok++;clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}}
function step(){if(!playing)return;const my=++tok;if(j>=S[i].s.length){if(i+1>=QN){playing=false;stop();return go(QN)}i++;j=0;scene()}
sub();mark();chips();const lg=$("lang").value,text=S[i].s[j][lg=="ar"?0:1];
const fin=()=>{if(my!==tok||!playing)return;j++;step()};
if(V[lg]){try{const u=new SpeechSynthesisUtterance(text);u.voice=V[lg];u.lang=V[lg].lang;u.rate=+$("rate").value;u.onend=fin;u.onerror=fin;speechSynthesis.cancel();speechSynthesis.speak(u);return}catch(e){}}
timer=setTimeout(fin,(2200+text.length*60)/+$("rate").value)}
function go(n){stop();i=Math.max(0,Math.min(QN,n));j=0;if(i>=QN){playing=false;qi=0;score=0;done=false;quiz();chips();btn();return}scene();if(playing)step()}
const D=["سهل · Easy","متوسط · Medium","صعب · Hard"];
function quiz(){$("bar").firstChild.style.width="100%";if(qi>=Q.length){const p=Math.round(score/Q.length*100);$("stage").innerHTML=`<h1>🎉 النتيجة · Your score</h1><p style="font-size:2rem;margin:.3em 0">${score} / ${Q.length} (${p}%)</p><p>${p>=75?"ممتاز! فاهم المحاضرة كويس.":"كمّل مراجعة وجرّب تاني."}</p><p class="en">${p>=75?"Excellent! You understood the lecture well.":"Review the scenes and try again."}</p><button class="main" id="rs">↺ إعادة · Retry</button>`;$("rs").onclick=()=>{qi=0;score=0;quiz()};return}
const q=Q[qi];done=false;$("stage").innerHTML=`<span class="badge">${D[q.d]}</span> <span class="note">${qi+1} / ${Q.length}</span><h1 style="margin-top:8px">${q.q[0]}</h1><div class="en">${q.q[1]}</div>`+q.o.map((o,n)=>`<button class="opt" data-n="${n}"><div>${o[0]}</div><div class="e">${o[1]}</div></button>`).join("")+`<div id="fb"></div>`;
$("stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const n=+b.dataset.n;if(n==q.c)score++;b.classList.add(n==q.c?"ok":"no");$("stage").querySelectorAll(".opt")[q.c].classList.add("ok");$("fb").innerHTML=`<div class="fb"><b>${n==q.c?"✅ صح · Correct":"❌ غلط · Not quite"}</b><div>${q.x[0]}</div><div class="en">${q.x[1]}</div></div><p><button class="main" id="nq">${qi==Q.length-1?"النتيجة · Result":"التالي · Next"}</button></p>`;$("nq").onclick=()=>{qi++;quiz()}})}
$("play").onclick=()=>{if(playing){playing=false;stop();btn()}else{playing=true;btn();step()}};
$("next").onclick=()=>go(i+1);$("prev").onclick=()=>go(i-1);
$("chips").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.n)};
$("lang").onchange=()=>{if(playing){stop();step()}};
if(!("speechSynthesis" in window))$("note").textContent="المتصفح مش بيدعم الصوت، الشرح بالترجمة المكتوبة · No speech support, subtitles only.";
scene();
</script>
